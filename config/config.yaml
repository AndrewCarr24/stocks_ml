# Panel recipe and walk defaults. The champion's own settings (horizon 4w,
# purge 35 days, 5-year window, K=4, book/ballast rules) live in
# models/champion_spec.json and selection.py; the live job overrides
# data_dir and backtest_start for the world it runs on (data/world.py).
data_dir: data
user_agent: "stocks_ml research carr.andrewjohn@gmail.com"
horizon_days: 5            # base label horizon in trading days; label_4w = 4x
purge_days: 10             # default calendar-day gap between train data and prediction date
rebalance_weekday: 4       # 0=Mon ... 4=Fri; rebalance = last trading day <= each Friday
retrain_weeks: 4           # members kept by a multi-date walk (models/walk.py)
backtest_start: "2005-01-03"
cv_train_years: 2          # default trailing training window; selection passes its own
train_sample_rows: null    # optional cap on training rows (most recent kept); null = all
fred_series:               # series_id: publication lag in calendar days
  VIXCLS: 1
  T10Y2Y: 1
  DTB3: 1
  ICSA: 5
  CPIAUCSL: 14
  # Monthly average dated at the first of the observation month. A one-day lag
  # leaked the rest of that month; 35 days makes it available only next month.
  FEDFUNDS: 35
  UNRATE: 7
  UMCSENT: 14
  DTWEXBGS: 3
edgar_concepts:            # canonical name: us-gaap XBRL tag fallbacks (first match wins)
  revenues: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax, SalesRevenueNet, SalesRevenueGoodsNet]
  net_income: [NetIncomeLoss]
  gross_profit: [GrossProfit]
  assets: [Assets]
  equity: [StockholdersEquity, StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]
  liabilities: [Liabilities]
  ocf: [NetCashProvidedByUsedInOperatingActivities]
  shares: [CommonStockSharesOutstanding, EntityCommonStockSharesOutstanding]
