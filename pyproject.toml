[project]
name = "stocks-ml"
version = "0.2.0"
description = "S&P 500 monthly ranking system: the r5 champion, its selection procedure and its weekly paper-trading job"
# 3.12 is what the champion is locked, graded and run (GitHub Actions) on.
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.4",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.4,<=1.5.1",
    "xgboost>=2.0",
    "scipy>=1.11",
]

[project.scripts]
stocks-ml = "stocks_ml.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stocks_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
