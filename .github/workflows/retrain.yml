name: Monthly retrain (retired 2026-09-01; manual only)

# Schedule removed 2026-09-01. This job re-tunes the legacy tournament
# (xgb/lgbm/catboost/enet + strategy variants) and overwrites
# models/champion.joblib on a calendar. The nested-selection test (AGENTS.md
# 9f) showed calendar re-tuning loses to a frozen model, and the production
# champion is now models/champion_spec.json, selected with `stocks-ml select`
# (licensed Sharadar data + hours of compute, so it does not run here).
# Left dispatchable for one-off legacy comparisons.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with weekly.yml so the two workflows never run at the same time
  # (both commit artifacts back to main).
  group: stocks-ml-jobs
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    # Known risk: the automl candidate's grid search may exceed the GitHub
    # runner's time budget for the full training set. If this job times out,
    # set `train_sample_rows: 250000` in config/config.yaml to cap rows.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        # uv reads .python-version and provisions Python 3.12.

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: stocks-ml-data-${{ github.run_id }}
          restore-keys: |
            stocks-ml-data-

      - run: uv sync

      - run: uv run stocks-ml ingest

      - run: uv run stocks-ml train

      - run: uv run stocks-ml backtest

      - name: Save data cache
        uses: actions/cache/save@v4
        with:
          path: data
          key: stocks-ml-data-${{ github.run_id }}

      - name: Commit and push artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models reports
          git diff --cached --quiet || git commit -m "chore(retrain): champion + backtest $(date -u +%F)"
          git push
