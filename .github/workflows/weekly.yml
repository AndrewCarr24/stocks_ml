name: Weekly shadow-deployment cycle

on:
  schedule:
    # Saturday 13:00 UTC — after Friday close.
    - cron: "0 13 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Shared with retrain.yml so the two workflows never run at the same time
  # (both commit artifacts back to main).
  group: stocks-ml-jobs
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        # uv reads .python-version and provisions Python 3.12.

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: stocks-ml-data-${{ github.run_id }}
          # No exact match on a fresh run_id, so this always falls through to
          # the newest previous cache. A miss (first-ever run) just means
          # `ingest` rebuilds everything from scratch — self-healing.
          restore-keys: |
            stocks-ml-data-

      - run: uv sync

      - run: uv run stocks-ml ingest

      - run: uv run stocks-ml signals

      - run: uv run stocks-ml ledger apply

      - run: uv run stocks-ml ledger mark

      # Shadow race: the LTR challenger's paper ledger, same cycle.
      - run: uv run stocks-ml ledger apply --ledger ledger_ltr.json --tag ltr

      - run: uv run stocks-ml ledger mark --ledger ledger_ltr.json

      - name: Save data cache
        uses: actions/cache/save@v4
        with:
          path: data
          key: stocks-ml-data-${{ github.run_id }}

      - name: Commit and push artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals ledger.json ledger_ltr.json
          git diff --cached --quiet || git commit -m "chore(weekly): signals + ledger $(date -u +%F)"
          git push

      - name: Open tracking issue with this week's signal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(ls -t signals/*.md 2>/dev/null | head -n1)
          if [ -f "$latest" ]; then
            gh issue create --title "Weekly signals $(date -u +%F)" --body-file "$latest"
          fi
